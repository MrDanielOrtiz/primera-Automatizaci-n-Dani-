name: Radar Jurisprudencial

on:
  workflow_dispatch:
    inputs:
      target_edition_date:
        description: "Fecha del Semanario a procesar (YYYY-MM-DD). Vacío = último publicado."
        required: false
        default: ""
  schedule:
    # GitHub Actions cron usa UTC. Mexico City en octubre = UTC-6.
    - cron: "*/30 19-23 * * 5"\n    - cron: "*/30 0-5 * * 6"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run radar
        env:
          RADAR_EMAIL_FROM: ${{ secrets.RADAR_EMAIL_FROM }}
          RADAR_EMAIL_PASSWORD: ${{ secrets.RADAR_EMAIL_PASSWORD }}
          RADAR_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
          TARGET_EDITION_DATE: ${{ inputs.target_edition_date }}
        run: python main.py
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-jurisprudencial-${{ github.run_id }}
          path: |
            reports/*
            data/processed/*
            data/raw/*.zip
            seen.json
            ius_checkpoint.json
          if-no-files-found: warn
      - name: Commit history
        if: success()
        run: |
          git config user.name "radar-jurisprudencial-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports seen.json ius_checkpoint.json
          git diff --cached --quiet || git commit -m "chore: radar jurisprudencial semanal"
          git push
