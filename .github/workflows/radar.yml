name: Radar Jurisprudencial

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"
      timezone: "America/Mexico_City"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Run radar
        env:
          RADAR_EMAIL_FROM: ${{ secrets.RADAR_EMAIL_FROM }}
          RADAR_EMAIL_PASSWORD: ${{ secrets.RADAR_EMAIL_PASSWORD }}
        run: python main.py
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-jurisprudencial
          path: |
            reports/*
            data/processed/*
            data/raw/*.zip
          if-no-files-found: warn
      - name: Commit history
        if: success()
        run: |
          git config user.name "radar-jurisprudencial-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "chore: radar jurisprudencial semanal"
          git push
